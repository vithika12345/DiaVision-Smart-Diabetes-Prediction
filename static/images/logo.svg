<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Shape -->
  <path d="M24 4L7 11V23.5C7 34.2 14.3 43.8 24 46C33.7 43.8 41 34.2 41 23.5V11L24 4Z" 
        fill="url(#shieldGrad)" 
        stroke="#14b8a6" 
        stroke-width="1.5" 
        stroke-linejoin="round" />

  <!-- Shield Inner Accent Border -->
  <path d="M24 7L10 13V23.5C10 32.5 16 40.5 24 42.5C32 40.5 38 32.5 38 23.5V13L24 7Z" 
        stroke="rgba(255,255,255,0.18)" 
        stroke-width="1" 
        fill="none" />

  <!-- Medical Cross / Pulse Wave -->
  <path d="M13 24H18L21 16L24.5 31L28 20L30.5 24H35" 
        stroke="url(#pulseGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Center Focal Spark -->
  <circle cx="24.5" cy="31" r="1.5" fill="#ffffff" />
</svg>
